{% extends "base.html" %}

{% block content %}
<h2>Edit Parking Lot</h2>
<form method="POST" action="{{ url_for('edit_lot', lot_id=lot.id) }}">
    <div class="mb-3">
        <label for="name" class="form-label">Prime Location Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ lot.prime_location_name }}" required>
    </div>
    <div class="mb-3">
        <label for="price" class="form-label">Price per Hour</label>
        <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ lot.price }}" required>
    </div>
    <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input type="text" class="form-control" id="address" name="address" value="{{ lot.address }}" required>
    </div>
    <div class="mb-3">
        <label for="pincode" class="form-label">Pin Code</label>
        <input type="text" class="form-control" id="pincode" name="pincode" value="{{ lot.pin_code }}" required>
    </div>
    <div class="mb-3">
        <label for="max_spots" class="form-label">Maximum Number of Spots</label>
        <input type="number" class="form-control" id="max_spots" name="max_spots" value="{{ lot.maximum_number_of_spots }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
