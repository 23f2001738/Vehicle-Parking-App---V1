openapi: 3.0.0
info:
  title: Vehicle Parking App API
  version: 1.0.0
paths:
  /api/spots:
    get:
      summary: Get all parking spots
      responses:
        '200':
          description: A list of parking spots
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    lot_id:
                      type: integer
                    status:
                      type: string